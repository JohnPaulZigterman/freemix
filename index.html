<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreeMix Archive Search</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="search-panel" aria-label="Freemix status">
        <div class="brand-row">
          <div>
            <p class="eyebrow">Internet Archive videos</p>
            <h1>FreeMix</h1>
          </div>
          <a class="catalogue-link" href="catalogue.html">Ideas</a>
          <span class="status-pill" id="statusPill">Ready</span>
        </div>
      </section>

      <section class="player-panel" id="playerPanel" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <div class="play-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M8 5v14l11-7-11-7Z" />
            </svg>
          </div>
          <h2>Search, pick, play.</h2>
          <p>Choose an Internet Archive video result and it will load here.</p>
        </div>
      </section>
    </main>

    <script src="app-state.js"></script>
    <script src="app.js"></script>
    <script src="app-render.js"></script>
    <script src="app-events.js"></script>
    <script>
      const __searchParams = new URLSearchParams(window.location.search);
      const __debugMode = ["1", "true"].includes(__searchParams.get("debug"));
      if (__debugMode || window.__freemixLocalDebug === true) {
        window.freemixDebugEnabled = true;
        const debugScript = document.createElement("script");
        debugScript.src = "app-debug.js";
        document.body.appendChild(debugScript);
      } else {
        window.freemixDebugEnabled = false;
      }
    </script>
  </body>
</html>
