<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreeMix Archive Search</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="search-panel" aria-label="Internet Archive video search">
        <div class="brand-row">
          <div>
            <p class="eyebrow">Internet Archive videos</p>
            <h1>FreeMix</h1>
          </div>
          <span class="status-pill" id="statusPill">Ready</span>
        </div>

        <div class="search-box" role="combobox" aria-haspopup="listbox" aria-expanded="false">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m21 21-4.35-4.35m1.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" />
          </svg>
          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search public-domain films, concerts, talks..."
            aria-controls="resultsList"
            aria-autocomplete="list"
          />
        </div>

        <div class="results-popover" id="resultsPopover" hidden>
          <ul id="resultsList" role="listbox" aria-label="Search results"></ul>
        </div>
      </section>

      <section class="player-panel" id="playerPanel" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <div class="play-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M8 5v14l11-7-11-7Z" />
            </svg>
          </div>
          <h2>Search, pick, play.</h2>
          <p>Choose an Internet Archive video result and it will load here.</p>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
